name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Pure docs PRs need no validation — lint / build / typecheck / test
    # don't touch markdown. The push: main run still validates end-to-end.
    paths-ignore:
      - '**.md'

permissions:
  contents: read

# Cancel in-progress runs when newer commits land on the same ref. Saves
# CI minutes when a PR is iterated with multiple consecutive pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Full Node matrix on main; PRs run a single version to cut CI minutes.
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('[22]') || fromJSON('[22, 24]') }}
    name: ci (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v6

      # Pinned to v4.4.0 (rather than the floating @v4 tag) because the
      # floating @v4 was reverted to a Node 20 manifest after the v4 → v5
      # cut. v4.4.0 keeps the v4 codebase but declares `using: node24` in
      # its manifest, eliminating the per-run deprecation warning without
      # taking on v6's known regressions (see dependabot.yml comment).
      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  standalone-x402:
    if: github.event_name == 'pull_request'
    name: standalone x402 (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            target: node22-linux-x64
          - os: macos-14
            label: macos-arm64
            target: node22-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @a2x/sdk build
      - run: pnpm --filter @a2x/cli build

      - name: Build host standalone binary
        run: pnpm --filter @a2x/cli exec pkg bin-bundle/a2x.cjs --targets ${{ matrix.target }} --output binaries/a2x-smoke --compress Brotli --public

      - name: Verify standalone x402 signing
        run: node packages/cli/scripts/smoke-x402-binary.mjs packages/cli/binaries/a2x-smoke
